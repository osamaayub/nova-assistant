name: Security audit

# Checks the dependencies that ship in the installer for known vulnerabilities.
# Weekly, on demand, and whenever the lockfile changes. Informational on pull requests
# (an old advisory should not block an unrelated change); the weekly run is the alarm.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit for high and critical issues
        run: npm audit --omit=dev --audit-level=high
