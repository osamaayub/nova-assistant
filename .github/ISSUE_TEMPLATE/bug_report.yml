name: Bug report
description: Something in Nova does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use a public issue. See SECURITY.md.
        Please never paste API keys, phone numbers or private file contents.
  - type: input
    id: version
    attributes:
      label: Nova version
      description: The release you downloaded (see the Releases page), or `version` in package.json if you run from source.
      placeholder: 1.2.1
    validations:
      required: true
  - type: dropdown
    id: brain
    attributes:
      label: Brain in use
      options:
        - Ollama (local)
        - Free cloud
        - Claude
        - Not sure
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model name (Ollama only)
      placeholder: qwen3:4b-instruct
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Windows desktop app
        - Web preview (Vercel)
        - Phone link
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you say or do, and what happened?
      description: What you expected, and what you got instead. Include the one-line error Nova showed.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and free RAM
      placeholder: Windows 10 22H2, 8 GB free
